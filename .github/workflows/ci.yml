name: CI

on:
  push:
    branches: [claude, main]
  pull_request:
    branches: [claude]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  #if (claude)
  # Cancel superseded pull request runs only; every push to claude must finish so Sync main sees it.
  #endif
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Coverage (Business and Components keep at least 80% of lines)
        run: |
          for project in Business Components; do
            dotnet test -c Release --no-build --project "tests/CslaStarter.$project.Tests" \
              --coverage --coverage-output-format cobertura --coverage-output "$project.cobertura.xml" --results-directory TestResults/coverage
          done
          bash scripts/check-coverage.sh 80 CslaStarter.Business TestResults/coverage/Business.cobertura.xml CslaStarter.Components TestResults/coverage/Components.cobertura.xml
      - name: End-to-end tests compile (outside the solution; the E2E workflow runs them)
        run: |
          dotnet build tests/CslaStarter.E2E.Tests -c Release
          dotnet format tests/CslaStarter.E2E.Tests/CslaStarter.E2E.Tests.csproj --verify-no-changes --no-restore
      - name: Script tests (template packing included; a generated app is built)
        run: bash scripts/tests/run.sh
        env:
          TEMPLATE_BUILD: '1'


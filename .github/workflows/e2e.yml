name: E2E

# Real browser, mock Entra ID and axe scan. Its own workflow, so a failure never blocks CI or the sync to main.
# The project is outside the solution (Playwright's package is large) and is built here.
on:
  push:
    branches: [claude]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: GC Design System assets (the components need them in a real browser)
        run: bash scripts/update-gcds.sh
      - name: Build the end-to-end tests
        run: dotnet build tests/CslaStarter.E2E.Tests
      - name: Install Chromium
        run: pwsh tests/CslaStarter.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Development certificate
        run: dotnet dev-certs https
      - name: End-to-end tests
        run: dotnet test --project tests/CslaStarter.E2E.Tests --no-build
        env:
          E2E: '1'

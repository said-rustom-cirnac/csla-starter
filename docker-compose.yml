# Local development only: PostgreSQL with the app's roles, and a mock OpenID Connect server standing in for Entra ID.
#   docker compose up -d
#   dotnet ef database update -p src/CslaStarter.Data -s src/CslaStarter.Data   (with CSLASTARTER_DESIGN_CONNECTION set to the Owner string)
# The passwords below are for these local containers only.
name: csla-starter

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres-dev-only
      APP_OWNER_PASSWORD: owner-dev-only
      APP_RUNTIME_PASSWORD: runtime-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./deploy/sql:/deploy/sql:ro
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/mock-oidc.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/mock-oidc:/config:ro

volumes:
  postgres-data:
